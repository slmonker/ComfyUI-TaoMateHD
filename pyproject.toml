[project]
name = "taomate-hd"
version = "0.1.0"
description = "ComfyUI sampler adapter for TaoMate-HD three-stage progressive MiniMax H3 audio-video generation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "slmonker" }]
keywords = ["comfyui", "taomate", "minimax-h3", "audio-video", "progressive-sampling"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Repository = "https://github.com/slmonker/ComfyUI-TaoMateHD"
Documentation = "https://github.com/slmonker/ComfyUI-TaoMateHD#readme"
"Bug Tracker" = "https://github.com/slmonker/ComfyUI-TaoMateHD/issues"

[tool.comfy]
PublisherId = "slmonker"
DisplayName = "TaoMate-HD Progressive Sampler"
